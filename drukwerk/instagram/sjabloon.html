<!doctype html><html><head><meta charset="utf-8">
<!-- DDD Instagram-sjabloon. Vervang foto.jpg door je eigen foto en pas de teksten hieronder aan.
     Open met ?story voor 1080x1920 (story), ?post2 voor feed met logo bovenaan, &foto=bestand.jpg voor een andere foto, &kop=... / &sub=... voor andere tekst, anders 1080x1350 (feed). -->
<link rel="stylesheet" href="fonts.css">
<style>
:root{--creme:#faf2ec;--zand:#f3e6dc;--rand:#c89f86;--bruin:#9a5f4b;--donker:#7a4e3f;--roze:#c9999a}
*{box-sizing:border-box;margin:0}
body{width:1080px;height:1350px;background:var(--creme);font-family:'Cormorant Garamond',serif;color:var(--donker);position:relative;overflow:hidden}
body.story{height:1920px}
/* zachte achtergrondcirkels */
.blob{position:absolute;border-radius:50%;background:var(--zand)}
.b1{width:620px;height:620px;left:-220px;top:-200px}.b2{width:520px;height:520px;right:-200px;bottom:-160px}
.hart{position:absolute;color:var(--roze);font-size:34px}
.frame{position:absolute;left:50%;transform:translateX(-50%);top:28px;width:1024px;height:1112px;border:2px solid var(--rand);border-radius:28px;padding:7px;background:#fff8}
.frame img{width:100%;height:100%;object-fit:cover;border-radius:21px;display:block;object-position:center 55%}
.logo{position:absolute;width:170px;height:170px;border-radius:50%;box-shadow:0 6px 24px #7a4e3f33}
.onder{position:absolute;left:0;right:0;text-align:center}
.kop{font-family:'Dancing Script',cursive;font-size:64px;color:var(--bruin);line-height:1}
.lijn{display:flex;align-items:center;justify-content:center;gap:18px;margin:8px 0 6px;color:var(--roze);font-size:26px}
.lijn:before,.lijn:after{content:"";width:150px;height:2px;background:var(--rand);border-radius:2px}
.sub{font-size:31px;font-weight:600;letter-spacing:.5px}
/* feed */
body:not(.story):not(.post2) .logo{left:40px;top:1060px}
body:not(.story):not(.post2) .onder{top:1160px;padding-left:190px}
/* story */
.story .logo{left:50%;transform:translateX(-50%);top:48px;width:190px;height:190px}
.story .frame{top:270px;width:1024px;height:1360px}
.story .onder{top:1680px}
.story .kop{font-size:88px}
/* feed, variant 2: layout zoals de story */
.post2 .logo{left:50%;transform:translateX(-50%);top:22px;width:130px;height:130px}
.post2 .frame{top:168px;width:900px;height:1012px}
.post2 .frame img{object-position:center 62%}
.post2 .onder{top:1192px;padding-left:0}
.post2 .kop{font-size:60px}
.post2 .sub{font-size:29px}
</style></head><body>
<div class="blob b1"></div><div class="blob b2"></div>
<span class="hart" style="left:1000px;top:1300px;font-size:26px">♥</span><span class="hart" style="display:none">♥</span>
<div class="frame"><img src="foto.jpg" alt=""></div>
<img class="logo" src="logo.png" alt="DDD logo">
<div class="onder">
  <div class="kop">Jouw naam, jouw beker</div>
  <div class="lijn">♥</div>
  <div class="sub">Gepersonaliseerd met liefde · Printing for you</div>
</div>
<script>if(location.search.includes('story'))document.body.classList.add('story');if(location.search.includes('post2'))document.body.classList.add('post2');var f=new URLSearchParams(location.search).get('foto');if(f)document.querySelector('.frame img').src=f;var q=new URLSearchParams(location.search),k=q.get('kop'),s=q.get('sub');if(k)document.querySelector('.kop').textContent=k;if(s)document.querySelector('.sub').textContent=s</script>
</body></html>
