<!doctype html><html><head><meta charset="utf-8">
<!-- DDD Instagram-post (1080x1350): "Vaatwasser? Nee, dank je!" -->
<link rel="stylesheet" href="fonts.css">
<style>
:root{--creme:#faf2ec;--zand:#f3e6dc;--rand:#c89f86;--bruin:#9a5f4b;--donker:#7a4e3f;--roze:#c9999a}
*{box-sizing:border-box;margin:0}
body{width:1080px;height:1350px;background:var(--creme);font-family:'Cormorant Garamond',serif;color:var(--donker);position:relative;overflow:hidden;text-align:center}
.blob{position:absolute;border-radius:50%;background:var(--zand)}
.b1{width:620px;height:620px;left:-220px;top:-200px}.b2{width:560px;height:560px;right:-220px;bottom:-200px}
.kader{position:absolute;inset:28px;border:2px solid var(--rand);border-radius:28px}
.logo{position:absolute;left:50%;transform:translateX(-50%);top:70px;width:180px;height:180px;border-radius:50%;box-shadow:0 6px 24px #7a4e3f33}
.inhoud{position:absolute;left:90px;right:90px;top:270px;bottom:60px;display:flex;flex-direction:column;justify-content:center}
.kop{font-family:'Dancing Script',cursive;font-size:116px;color:var(--bruin);line-height:1.05}
.lijn{display:flex;align-items:center;justify-content:center;gap:18px;margin:22px 0 10px;color:var(--roze);font-size:30px}
.lijn:before,.lijn:after{content:"";width:170px;height:2px;background:var(--rand);border-radius:2px}
svg{display:block;margin:0 auto}
.tekst{font-size:54px;line-height:1.25;font-weight:500;margin-top:14px}
.tekst b{color:var(--bruin);font-weight:700}
.slot{font-family:'Dancing Script',cursive;font-size:66px;color:var(--bruin);margin-top:34px}
</style></head><body>
<div class="blob b1"></div><div class="blob b2"></div><div class="kader"></div>
<img class="logo" src="logo.png" alt="DDD logo">
<div class="inhoud">
  <div class="kop">Vaatwasser?<br>Nee, dank je!</div>
  <div class="lijn">♥</div>
  <svg width="360" height="276" viewBox="0 0 300 230" fill="none" stroke="#9a5f4b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <!-- beker -->
    <path d="M85 60h110v110a26 26 0 0 1-26 26h-58a26 26 0 0 1-26-26z" fill="#fff"/>
    <path d="M195 85h14a24 24 0 0 1 0 48h-14"/>
    <path d="M140 138c-14-10-24-18-24-28a11 11 0 0 1 24-4a11 11 0 0 1 24 4c0 10-10 18-24 28z" fill="#c9999a" stroke="#c9999a" stroke-width="3"/>
    <!-- sopbelletjes -->
    <g stroke="#c89f86" stroke-width="5" fill="#faf2ec">
      <circle cx="60" cy="40" r="16"/><circle cx="36" cy="80" r="10"/><circle cx="238" cy="36" r="13"/><circle cx="262" cy="170" r="10"/><circle cx="46" cy="160" r="8"/>
    </g>
    <path d="M110 30l6-14M140 26v-16M170 30l-6-14" stroke="#c9999a" stroke-width="5"/>
  </svg>
  <p class="tekst">Deze beker is een echte diva<br>en wil alleen een <b>handwasje</b>.</p>
  <div class="slot">Zo blijft je print knallen,<br>slok na slok! <span style="color:#c9999a">♥</span></div>
</div>
</body></html>
